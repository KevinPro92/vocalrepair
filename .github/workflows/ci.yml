name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: tests (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # 只装 dev extras：绝不把 torch / demucs 拉进 CI（1.5 GB，且无用）。
      # pyworld 也不装——核心单元测试不依赖它，analysis 与 dsp 层可以独立验证。
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: syntax & import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Compile all sources
        run: python -m compileall -q src vocal_spectra.py tests
      - name: Import smoke test
        run: python -c "import vocalrepair, vocalrepair.pipeline, vocalrepair.report; print(vocalrepair.__version__)"
